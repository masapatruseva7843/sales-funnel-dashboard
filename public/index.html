<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>Дашборд продаж</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">CRM · АНАЛИТИКА</p>
          <h1>Дашборд продаж</h1>
          <p class="subtitle">Воронка и динамика сделок в одном окне</p>
        </div>
        <form id="period-form" class="period-form">
          <label>Воронка
            <select id="category" name="categoryId" aria-label="Воронка или направление">
              <option value="0">Основная воронка</option>
            </select>
          </label>
          <fieldset class="date-filter">
            <legend>По дате создания</legend>
            <label>С <input id="created-from" type="date" name="createdFrom"></label>
            <label>По <input id="created-to" type="date" name="createdTo"></label>
          </fieldset>
          <fieldset class="date-filter">
            <legend>По дате закрытия</legend>
            <label>С <input id="closed-from" type="date" name="closedFrom"></label>
            <label>По <input id="closed-to" type="date" name="closedTo"></label>
          </fieldset>
          <button type="submit">Применить</button>
        </form>
      </header>

      <section id="status" class="status" aria-live="polite"></section>
      <section id="metrics" class="metrics" aria-label="Ключевые показатели"></section>
      <section class="panel funnel-panel">
        <div class="panel-heading"><div><p class="eyebrow">СТРУКТУРА</p><h2>Воронка по стадиям</h2></div><span id="funnel-total" class="muted"></span></div>
        <div id="funnel" class="funnel"></div>
      </section>
      <section class="panel">
        <div class="panel-heading"><div><p class="eyebrow">АКТУАЛЬНОЕ</p><h2>Последние сделки</h2></div><span class="muted">до 20 записей</span></div>
        <div class="table-wrap"><table><thead><tr><th>Сделка</th><th>Сумма</th><th>Стадия</th><th>Ответственный</th><th>Создана</th></tr></thead><tbody id="deals"></tbody></table></div>
      </section>
    </main>
    <template id="empty"><div class="empty"><strong>Данных нет</strong><span>Измените период или создайте первую сделку в CRM.</span></div></template>
    <script src="/app.js" defer></script>
  </body>
</html>
